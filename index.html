<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wizard Adventure 3D</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #1a1a1a;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #fff; font-family: Arial, sans-serif;
            overflow: hidden; touch-action: none; user-select: none;
        }
        canvas {
            border: 4px solid #333; background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 4px; max-width: 100vw; max-height: 100vh;
            object-fit: contain;
        }
        /* Mobile UI forces display on small phone screens */
        @media (max-width: 1024px) { #mobileUI { display: flex !important; } }
    </style>
</head>
<body>
    <!-- MOBILE VIRTUAL GAMEPAD -->
    <div id="mobileUI" style="display: none; position: absolute; bottom: 8%; width: 100%; justify-content: space-between; padding: 0 5%; box-sizing: border-box; z-index: 10; touch-action: none; pointer-events: none;">
        <div style="display: flex; gap: 15px; pointer-events: auto;">
            <button id="btn-left" style="width: 65px; height: 65px; border-radius: 50%; opacity: 0.75; font-size: 24px; border: 2px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.6); color: white;">&#9664;</button>
            <button id="btn-right" style="width: 65px; height: 65px; border-radius: 50%; opacity: 0.75; font-size: 24px; border: 2px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.6); color: white;">&#9654;</button>
        </div>
        <div style="display: flex; gap: 15px; pointer-events: auto;">
            <button id="btn-shoot" style="width: 65px; height: 65px; border-radius: 50%; opacity: 0.85; font-size: 24px; font-weight: bold; border: 2px solid white; background: rgba(0, 200, 255, 0.6); color: white; text-shadow: 0 0 5px black;">Z</button>
            <button id="btn-jump" style="width: 65px; height: 65px; border-radius: 50%; opacity: 0.85; font-size: 28px; border: 2px solid white; background: rgba(255, 140, 0, 0.6); color: white; text-shadow: 0 0 5px black;">&#8673;</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <!-- Your Game Script -->
    <script src="game.js"></script>
</body>
</html>
